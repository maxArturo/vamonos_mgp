on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release_please

jobs:
  release_please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        with:
          release-type: dart
          package-name: vamonos-mgp
